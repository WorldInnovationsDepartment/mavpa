[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mavpa"
version = "0.2.0"
description = "Monkey see, monkey do: split any track into its parts, then rebuild it by hand in Ableton, FL Studio or GarageBand."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Danylo Vorvul" }]
requires-python = ">=3.10,<3.14"
keywords = ["music", "stems", "midi", "transcription", "ableton", "fl-studio", "garageband", "ear-training", "claude-code", "agent-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "librosa>=0.10",
  "soundfile>=0.12",
  "soxr>=0.3",
  "pretty_midi>=0.2.10",
  "mido>=1.3",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "torch>=2.1,<2.9",
  "torchaudio>=2.1,<2.9",
  "demucs>=4.0.1",
  # basic-pitch's own pins pull TensorFlow; bin/mavpa installs it with --no-deps on top of these:
  "onnxruntime>=1.16",
  "resampy>=0.4",
  "mir_eval>=0.7",
]

[project.scripts]
mavpa = "mavpa.cli:main"

[project.urls]
Homepage = "https://github.com/WorldInnovationsDepartment/mavpa"
Issues = "https://github.com/WorldInnovationsDepartment/mavpa/issues"

[tool.hatch.build.targets.wheel]
packages = ["mavpa"]

[tool.hatch.build.targets.sdist]
include = ["mavpa", "README.md", "LICENSE", "pyproject.toml"]
