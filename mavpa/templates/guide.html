  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, (_, x) => `<code>${x}</code>`);
  h = h.replace(/\{\{([^}]+)\}\}/g, (_, x) => { const ms = x.trim().split(/\s+/).map(noteNum); return ms.some((v) => v === null) ? x : span(ms); });
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*\n]+)\*/g, '<i>$1</i>');
  return h.replace(/ · /g, SEP);
}
function lead(s) {
  const m = /^\*\*([^*]+)\*\*\s*([\s\S]*)$/.exec(String(s ?? ''));
  return m ? { t: m[1].trim().replace(/[:.]$/, ''), b: m[2] } : { t: '', b: String(s ?? '') };
}
function steps(items) { return items && items.length ? `<ol class="steps">${items.map((i) => `<li>${md(i)}</li>`).join('')}</ol>` : ''; }
function rows(items, cls, tag = 'ol') {
  return `<${tag} class="rows ${cls}">` + (items || []).map((it) => { const { t, b } = lead(it); return `<li>${t ? `<p class="rows__t">${md(t)}</p>` : ''}${b ? `<p class="rows__b">${md(b)}</p>` : ''}</li>`; }).join('') + `</${tag}>`;
}
function table(t, label) {
  return `<div class="table-wrap" role="region" tabindex="0" aria-label="${esc(label || 'table')}"><table><thead><tr>${t.head.map((h) => `<th scope="col">${keep(txt(h))}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map((r) => `<tr>${r.map((c, i) => (i === 0 ? `<th scope="row">${md(c)}</th>` : `<td>${md(c)}</td>`)).join('')}</tr>`).join('') + '</tbody></table></div>';
}
function markSVG(p, size) {
  const bands = [48, 90, 132, 174];
  return `<svg viewBox="0 0 256 256" width="${size}" height="${size}" role="img" aria-label="mavpa"><defs>${bands.map((y, i) => `<clipPath id="${p}b${i}"><rect x="0" y="${y}" width="256" height="34"/></clipPath>`).join('')}</defs><rect class="mk-tile" width="256" height="256" rx="56"/><g transform="translate(20 20) scale(.84375)">${bands.map((_, i) => `<path class="mk-b${i}" clip-path="url(#${p}b${i})" d="${HEAD}"/>`).join('')}<g class="mk-face"><circle cx="104" cy="118" r="28"/><circle cx="152" cy="118" r="28"/><ellipse cx="128" cy="166" rx="50" ry="34"/></g><circle class="mk-b1" cx="106" cy="110" r="10"/><circle class="mk-b1" cx="150" cy="110" r="10"/></g></svg>`;
}
function facts(chips) {
  const out = [];
  for (const chip of chips || []) for (const part of String(chip).split(' · ')) {
    const p = part.trim();
    if (!p) continue;
    const m = /^(\d[\d/:.,]*)[\s-]*(.*)$/.exec(p);
    if (m) out.push({ fig: m[1].replace(/[.,]$/, ''), label: m[2] });
    else { const i = p.indexOf(', '); out.push(i > 0 ? { fig: p.slice(0, i), label: p.slice(i + 2), word: true } : { fig: p, label: '', word: true }); }
  }
  return out;
}

function roll(opt) {
  const keyW = 60, head = 26, row = Math.max(opt.row || 12, 18);
  const steps = opt.bars * SPB;
  const cell = Math.max(7, Math.min(opt.cell || 10, (ROLL_W - keyW) / steps));
  const W = Math.ceil(keyW + steps * cell + 2), H = head + (opt.hi - opt.lo + 1) * row + 1;
  let s = `<svg class="chart roll" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:${W}px;min-width:${Math.round(W * 0.88)}px" role="img" aria-label="${esc(opt.title || 'piano roll')}">`;
  for (let p = opt.hi; p >= opt.lo; p--) {
    const y = head + (opt.hi - p) * row, blk = [1, 3, 6, 8, 10].includes(((p % 12) + 12) % 12);
    s += `<rect class="${blk ? 'roll__b' : 'roll__w'}" x="${keyW}" y="${y}" width="${(steps * cell).toFixed(1)}" height="${row}"/>`;
    s += `<text class="roll__key" x="${keyW - 8}" y="${y + row - 5}" text-anchor="end">${nn(p)}</text>`;
  }
  for (let k = 0; k <= steps; k++) {
    const x = (keyW + k * cell).toFixed(1), bar = k % SPB === 0, beat = k % 4 === 0;
    s += `<line class="${bar ? 'g-bar' : beat ? 'g-beat' : 'g-step'}" x1="${x}" y1="${head}" x2="${x}" y2="${H}"/>`;
  }
  for (let b = 0; b < opt.bars; b++) s += `<text class="roll__bar" x="${(keyW + b * SPB * cell + 4).toFixed(1)}" y="${head - 8}">${esc(opt.labels[b] || '')}</text>`;
  for (const n of opt.notes) {
    if (n.p < opt.lo || n.p > opt.hi) continue;
    const x = keyW + ((n.b - 1) * SPB + n.s) * cell + 1, y = head + (opt.hi - n.p) * row + 1, w = Math.max(3, n.l * cell - 2);
    s += `<rect class="n-rect" data-layer="${lay(n.c)}" x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${row - 2}" rx="3"><title>${nn(n.p)}</title></rect>`;
    if (w >= 34) s += `<text class="n-label" data-layer="${lay(n.c)}" x="${(x + 4).toFixed(1)}" y="${y + row - 6}">${nn(n.p)}</text>`;
  }
  return s + '</svg>';
}
function rollBlock(r, lvl) {
  const legend = r.legend && r.legend.length > 1 ? `<ul class="legend">${r.legend.map((l) => `<li><span class="swatch" data-layer="${lay(l.c)}" aria-hidden="true"></span>${keep(txt(l.label))}</li>`).join('')}</ul>` : '';
  return `<figure class="roll-fig">${r.title ? `<h${lvl} class="roll-fig__t">${keep(txt(r.title))}</h${lvl}>` : ''}<div class="scroll" role="region" tabindex="0" aria-label="${esc(r.title || 'piano roll')}">${roll(r)}</div>${legend}</figure>`;
}
function drumGrids(d) {
  return '<div class="drums">' + d.instruments.map((inst) => `<div class="drum"><h4>${keep(txt(inst.label))}</h4><div class="scroll" role="region" tabindex="0" aria-label="${esc(inst.label)} pattern"><table class="drumgrid"><thead><tr><td></td>${STEPNAME.map((s) => `<th scope="col">${esc(s)}</th>`).join('')}</tr></thead><tbody>` +
    inst.rows.map((r) => `<tr><th scope="row">${txt(r.label)}</th>${[...String(r.steps).padEnd(SPB, '.')].slice(0, SPB).map((ch, i) => `<td class="${'Xxg'.includes(ch) ? ch : ''}${i % 4 === 0 ? ' beat' : ''}" title="${STEPNAME[i]}"></td>`).join('')}</tr>`).join('') + '</tbody></table></div></div>').join('') + '</div>';
}
let measureCtx = null;
function textWidth(t, px) {
  try {
    measureCtx = measureCtx || document.createElement('canvas').getContext('2d');
    measureCtx.font = `${px}px ${getComputedStyle(document.body).fontFamily}`;
    return measureCtx.measureText(t).width;
  } catch (e) { return t.length * px * 0.56; }
}
function songMap(m) {
  const W = MAP_W, lw = 152, top = 60, lh = 26, nb = m.nb;
  const bw = (W - lw - 6) / nb, H = top + m.lanes.length * lh + 6;
  const X = (bar) => lw + (bar - 1) * bw;
  let s = `<svg class="chart songmap" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="song map: ${nb} bars, one lane per layer, the sections above">`;
  m.sections.forEach((sec, i) => {
    const x = X(sec.a), w = (sec.b - sec.a + 1) * bw;
    s += `<rect class="map__sec${i % 2 ? ' map__sec--alt' : ''}" x="${(x + 0.5).toFixed(1)}" y="2" width="${Math.max(1, w - 1).toFixed(1)}" height="28" rx="5"/>`;
    if (sec.name && w > textWidth(lowerKeep(sec.name), 14) + 10) s += `<text class="map__secname" x="${(x + 6).toFixed(1)}" y="21">${esc(lowerKeep(sec.name))}</text>`;
    if (sec.name && w > 18) s += `<text class="map__bar" x="${(x + 1).toFixed(1)}" y="47">${sec.a}</text>`;
  });
  for (const mk of m.marks) for (const b of mk.bars) s += `<rect class="mark mark--${mk.strength === 'hard' ? 'hard' : 'soft'}" x="${X(b).toFixed(1)}" y="${top - 6}" width="${Math.max(bw, 2).toFixed(1)}" height="${H - top + 4}"><title>${esc(mk.label)}, bar ${b}</title></rect>`;
  m.lanes.forEach((ln, i) => {
    const y = top + i * lh, mid = y + lh / 2;
    s += `<text class="map__lane" x="${lw - 12}" y="${mid + 5}" text-anchor="end">${esc(lowerKeep(ln.name))}</text>`;
    s += `<line class="map__rest" x1="${lw}" y1="${mid}" x2="${W - 6}" y2="${mid}"/>`;
    for (const [a, b] of ln.r) s += `<rect class="lane-bar" data-layer="${lay(ln.c)}" x="${X(a).toFixed(1)}" y="${y + 5}" width="${Math.max(2, (b - a + 1) * bw - 1).toFixed(1)}" height="${lh - 10}" rx="4"><title>${esc(ln.name)}, bars ${a} to ${b}</title></rect>`;
  });
  return s + '</svg>';
}
function strip(m) {
  const sets = { drums: new Set(), bass: new Set(), pad: new Set(), vocal: new Set() };
  for (const ln of m.lanes) { const st = stemOf(ln.c); if (st) for (const [a, b] of ln.r) for (let x = a; x <= b; x++) sets[st].add(x); }
  const W = MAP_W, lw = 84, lh = 18, nb = m.nb, bw = (W - lw - 6) / nb, H = 4 * lh + 2;
  const X = (bar) => lw + (bar - 1) * bw;
  let s = `<svg class="chart strip__svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="the song in its four stems: where drums, bass, music and vocals play across ${nb} bars">`;
  for (const sec of m.sections) if (sec.a > 1 && sec.name) s += `<line class="strip__sec" x1="${X(sec.a).toFixed(1)}" y1="0" x2="${X(sec.a).toFixed(1)}" y2="${H}"/>`;
  STEMS.forEach(([key, name], i) => {
    const y = i * lh, mid = y + lh / 2, bars = [...sets[key]].sort((p, q) => p - q);
    s += `<text class="strip__name" x="${lw - 12}" y="${mid + 5}" text-anchor="end">${name}</text><line class="map__rest" x1="${lw}" y1="${mid}" x2="${W - 6}" y2="${mid}"/>`;
    for (let j = 0; j < bars.length;) { let k = j; while (k + 1 < bars.length && bars[k + 1] === bars[k] + 1) k++; s += `<rect class="lane-bar" data-layer="${key}" x="${X(bars[j]).toFixed(1)}" y="${y + 4}" width="${Math.max(2, (bars[k] - bars[j] + 1) * bw - 1).toFixed(1)}" height="${lh - 8}" rx="4"/>`; j = k + 1; }
  });
  return s + '</svg>';
}
function sectionTable(m) {
  const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
  const body = m.sections.filter((s) => s.name).map((s) => `<tr><th scope="row">${txt(s.name)}</th><td>${s.a}${s.b !== s.a ? ` to ${s.b}` : ''}</td><td>${fmt(s.t_daw)}</td><td>${fmt(s.t_orig)}</td></tr>`).join('');
  return `<div class="table-wrap" role="region" tabindex="0" aria-label="sections"><table><thead><tr><th scope="col">Section</th><th scope="col">DAW bars</th><th scope="col">Starts (kit audio)</th><th scope="col">Starts (original file)</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function card(c) {
  const L = lay(c.color), a = c.answer;
  const where = String(c.where || '').split(' · ').filter(Boolean);
  let aside = '';
  if (where.length) aside += `<ul class="where">${where.map((w) => `<li>${md(w)}</li>`).join('')}</ul>`;
  if (c.sound) aside += `<div class="sound"><h4>Sound</h4><p>${md(c.sound)}</p></div>`;
  let main = '';
  if (c.about) main += `<p>${md(c.about)}</p>`;
  if (c.list && c.list.length) main += steps(c.list);
  if (c.monkey && c.monkey.length) main += `<h4>Monkey it</h4>${steps(c.monkey)}`;
  let h = `<article class="layer" id="l-${esc(c.id)}" data-layer="${L}"><header class="layer__head"><span class="swatch swatch--lg" data-layer="${L}" aria-hidden="true"></span><h3>${keep(md(c.title))}</h3></header>`;
  h += `<div class="layer__grid">${main ? `<div class="layer__main">${main}</div>` : ''}${aside ? `<aside class="layer__aside">${aside}</aside>` : ''}</div>`;
  if (a && (a.rolls.length || a.tables.length || a.drums || a.text)) {
    h += `<details class="answer"><summary class="pill pill--disclose" title="${esc(a.summary)}"><span class="pill__t">${keep(txt(a.summary))}</span></summary><div class="well">`;
    if (a.intro) h += `<p>${md(a.intro)}</p>`;
    for (const t of a.tables) h += table(t, `${c.title} answer`);
    for (const r of a.rolls) h += rollBlock(r, 4);
    if (a.drums) h += drumGrids(a.drums);
    if (a.text) h += `<p>${md(a.text)}</p>`;
    if (a.note) h += `<p class="fine">${md(a.note)}</p>`;
    h += '</div></details>';
  }
  const R = c.recipes || {}, cols = [['fl', 'FL Studio recipe'], ['ableton', 'Ableton recipe'], ['garageband', 'GarageBand recipe']].filter(([k]) => R[k] && R[k].length);
  if (cols.length) h += `<div class="recipes">${cols.map(([k, t]) => `<div class="recipe"><h4>${t}</h4>${steps(R[k])}</div>`).join('')}</div>`;
  return h + '</article>';
}

function render() {
  const D = DATA;
  const t = String(D.title || ''), k = t.indexOf(' — ');
  $('#title').innerHTML = k > 0 ? `<span class="h1__song">${keep(md(t.slice(0, k)))}</span> <span class="h1__sub">${keep(md(t.slice(k + 3)))}</span>` : `<span class="h1__song">${keep(md(t))}</span>`;
  $('#eyebrow').textContent = String(D.eyebrow || '').split(' · ')[0];
  $('#strip').innerHTML = strip(D.map);
  $('#lede').innerHTML = md(D.lede);
  const F = facts(D.chips), chips = $('#chips');
  chips.style.setProperty('--n', F.length); chips.style.setProperty('--half', Math.ceil(F.length / 2));
  chips.innerHTML = F.map((f) => `<li${f.word ? ' class="is-word"' : ''}><span class="facts__fig">${md(f.fig)}</span>${f.label ? `<span class="facts__label">${md(f.label)}</span>` : ''}</li>`).join('');
  const head = (id, title, line) => `<header class="sec__head"><h2 id="${id}-h">${title}</h2>${line ? `<p class="lead">${line}</p>` : ''}</header>`;
  let h = '';
  const marks = D.map.marks.filter((mk) => mk.bars.length);
  h += `<section class="sec sec--dna" id="dna" aria-labelledby="dna-h">${head('dna', 'The song’s DNA (read this first)')}${rows(D.dna, 'rows--dna')}</section>`;
  const setups = [['FL Studio', D.setup.fl], ['Ableton Live', D.setup.ableton], ['GarageBand', D.setup.garageband]].filter(([, l]) => l && l.length);
  h += `<section class="sec sec--setup" id="setup" aria-labelledby="setup-h">${head('setup', 'Set up your session')}<div class="setup">${setups.map(([n, l]) => `<div class="setup__col"><h3>${n}</h3>${steps(l)}</div>`).join('')}</div></section>`;
  h += `<section class="sec sec--map" id="map" aria-labelledby="map-h">${head('map', 'Song map')}<div class="scroll scroll--map" role="region" tabindex="0" aria-label="song map">${songMap(D.map)}</div>` +
    `<div class="legend-row"><p class="legend__lead">${markSVG('ml', 28)}<span>colour is the stem a part lives in, the same four bands as the mavpa mark</span></p>` +
    `<ul class="legend">${STEMS.map(([l, n]) => `<li><span class="swatch" data-layer="${l}" aria-hidden="true"></span>${n}</li>`).join('')}${marks.map((mk) => `<li><span class="swatch swatch--mark${mk.strength === 'hard' ? ' swatch--hard' : ''}" aria-hidden="true"></span>${keep(txt(mk.label))}</li>`).join('')}</ul></div>` +
    `${sectionTable(D.map)}${D.map.note ? `<p class="fine">${md(D.map.note)}</p>` : ''}</section>`;
  D.harmony.forEach((hm, i) => {
    const id = i ? `loop-${i + 1}` : 'loop';
    h += `<section class="sec sec--loop" id="${id}" aria-labelledby="${id}-h">${head(id, keep(md(hm.title)), hm.intro ? md(hm.intro) : '')}${table(hm.table, hm.title)}`;
    if (hm.rolls.length) h += `<details class="answer"><summary class="pill pill--disclose" title="${esc(hm.rolls_summary)}"><span class="pill__t">${txt(hm.rolls_summary)}</span></summary><div class="well">${hm.rolls.map((r) => rollBlock(r, 3)).join('')}</div></details>`;
    if (hm.note) h += `<p class="fine">${md(hm.note)}</p>`;
    if (hm.callout) h += `<p class="statement">${md(hm.callout)}</p>`;
    h += '</section>';
  });
  h += `<section class="sec sec--layers" id="layers" aria-labelledby="layers-h">${head('layers', 'Every layer: monkey it, then check', md(D.cards_intro))}${D.cards.map(card).join('')}</section>`;
  h += `<section class="sec sec--method" id="method" aria-labelledby="method-h">${head('method', 'The monkey method (works for any track)')}${rows(D.method, 'rows--method')}</section>`;
  h += `<section class="sec sec--plan" id="plan" aria-labelledby="plan-h"><div class="band">${head('plan', 'Practice plan')}${rows(D.plan, 'rows--plan')}</div></section>`;
  h += `<section class="sec sec--files" id="files" aria-labelledby="files-h">${head('files', 'What’s in the kit')}<ul class="files">${(D.files || []).map((f) => { const s = String(f), i = s.indexOf(': '); return i > 0 ? `<li><p class="files__t">${md(s.slice(0, i))}</p><p>${md(s.slice(i + 2))}</p></li>` : `<li><p>${md(s)}</p></li>`; }).join('')}</ul></section>`;
  h += `<section class="sec sec--accuracy" id="accuracy" aria-labelledby="accuracy-h">${head('accuracy', 'How sure is this?')}${rows(D.accuracy, 'rows--accuracy', 'ul')}</section>`;
  $('#sections').innerHTML = h;
  $('#colophon').innerHTML = `<p>${md(D.footer)}</p><p>Made with <a href="https://github.com/WorldInnovationsDepartment/mavpa">mavpa</a>.</p>`;
  const toc = [['dna', 'the song’s dna'], ['setup', 'set up your session'], ['map', 'song map'], ...D.harmony.map((hm, i) => [i ? `loop-${i + 1}` : 'loop', keep(md(hm.title))]), ['layers', 'every layer'], ['method', 'the monkey method'], ['plan', 'practice plan'], ['files', 'what’s in the kit'], ['accuracy', 'how sure is this?']];
  $('#toc').innerHTML = toc.map(([id, label]) => `<li><a href="#${id}">${label}</a>${id === 'layers' ? `<ol class="toc__layers">${D.cards.map((c) => `<li><a href="#l-${esc(c.id)}"><span class="swatch" data-layer="${lay(c.color)}" aria-hidden="true"></span><span>${keep(md(c.title))}</span></a></li>`).join('')}</ol>` : ''}</li>`).join('');
}

let spy = null;
function setupSpy() {
  if (!('IntersectionObserver' in window)) return;
  if (spy) spy.disconnect();
  const links = new Map([...document.querySelectorAll('#toc a')].map((a) => [a.getAttribute('href').slice(1), a]));
  spy = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const id = e.target.dataset.spy || e.target.id, a = links.get(id);
      if (!a && id !== 'top') continue;
      document.querySelectorAll('#toc a[aria-current]').forEach((x) => x.removeAttribute('aria-current'));
      if (a) a.setAttribute('aria-current', 'location');
    }
  }, { rootMargin: '-30% 0px -60% 0px' });
  const hero = document.getElementById('top');
  if (hero) spy.observe(hero);
  for (const id of links.keys()) {
    let el = document.getElementById(id);
    if (!el) continue;
    if (id === 'layers') { el = el.querySelector('.sec__head'); if (!el) continue; el.dataset.spy = 'layers'; }
    spy.observe(el);
  }
}
function renderKeepOpen() {
  const open = [...document.querySelectorAll('#sections details')].map((d) => d.open);
  render();
  document.querySelectorAll('#sections details').forEach((d, i) => { if (open[i]) d.open = true; });
  setupSpy();
}
function setupControls() {
  const press = (sel, b) => document.querySelectorAll(sel).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  const NAMING = '#naming button, .naming-mirror button';
  document.querySelectorAll(NAMING).forEach((b) => b.addEventListener('click', () => {
    naming = b.dataset.v;
    document.querySelectorAll(NAMING).forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.v === naming)));
    renderKeepOpen();
    try { localStorage.setItem('mavpa-naming', naming); } catch (e) {}
  }));
  document.querySelectorAll('#theme button').forEach((b) => b.addEventListener('click', () => {
    const v = b.dataset.v;
    if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
    press('#theme button', b);
    try { localStorage.setItem('mavpa-theme', v); } catch (e) {}
  }));
  const rail = $('#rail'), tog = $('#rail-toggle');
  const close = () => { rail.removeAttribute('data-open'); tog.setAttribute('aria-expanded', 'false'); };
  tog.addEventListener('click', () => { const open = !rail.hasAttribute('data-open'); rail.toggleAttribute('data-open', open); tog.setAttribute('aria-expanded', String(open)); });
  $('#toc').addEventListener('click', (e) => { if (e.target.closest('a')) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && rail.hasAttribute('data-open')) { close(); tog.focus(); } });
  try {
    const n = localStorage.getItem('mavpa-naming');
    if (n && OFF[n] !== undefined) document.querySelector(`#naming button[data-v="${n}"]`).click();
    const t = localStorage.getItem('mavpa-theme');
    if (t && ['auto', 'light', 'dark'].includes(t)) document.querySelector(`#theme button[data-v="${t}"]`).click();
  } catch (e) {}
}
render(); setupSpy(); setupControls();
</script>
</body>
